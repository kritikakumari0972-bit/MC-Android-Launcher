name: Android CI

on:
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download prebuilt JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Prepare project
        run: |
          bash ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build Debug APK only
        run: |
          gradle :app_pojavlauncher:assembleDebug
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Generate checksum
        run: md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-Android-Debug
          path: |
            out/app-debug.apk
            out/app-debug.md5
          if-no-files-found: error
